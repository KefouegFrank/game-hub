---
deployment:
  tasks:
    # Only public_html/ is web-facing. config/, db/ and storage/ stay out of the
    # docroot and are placed once by hand — see README "Deploying to cPanel".
    - export DEPLOYPATH=$HOME/public_html/predictloncasino.com
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R public_html/. $DEPLOYPATH/
    - /bin/chmod 644 $DEPLOYPATH/.htaccess
